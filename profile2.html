<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your profile | Rentables</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rentables.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="front2.html"><img src="icon-192-v2.png" alt="" /><span>Rentables</span></a>
    <span class="nav-spacer"></span>
    <a class="btn btn-secondary" href="front2.html">Back to marketplace</a>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 id="greeting"></h1>
      <p>Manage your listings, rentals and account.</p>
    </div>

    <section class="section">
      <h2>My listings</h2>
      <button onclick="openListingForm()" class="btn btn-primary" style="margin-bottom:20px">New listing</button>
      <div id="listingFormContainer"></div>
      <div class="grid" id="listingsContainer"><p class="muted">You have no listings yet.</p></div>
    </section>

    <section class="section">
      <h2>My rentals</h2>
      <div class="grid" id="rentingsContainer"><p class="muted">You have not rented anything yet.</p></div>
    </section>

    <section class="section">
      <h2>Account</h2>
      <dl class="info-list">
        <dt>Email</dt><dd id="emailDisplay"></dd>
        <dt>Balance</dt><dd id="balanceDisplay"></dd>
        <dt>Member since</dt><dd>September 2025</dd>
      </dl>
    </section>

    <section class="section">
      <h2>Settings</h2>
      <div class="link-list">
        <a class="btn btn-secondary" href="index.html">Sign out</a>
        <button onclick="resetUserData()" class="btn btn-danger">Delete my account</button>
        <button onclick="logoutUser()" class="btn btn-danger">Reset all data</button>
      </div>
    </section>
  </main>

  <script>
    const name = localStorage.getItem("userName") || "Guest";
    const email = localStorage.getItem("userEmail") || "Not provided";
    const balance = localStorage.getItem("userBalance") || "0";

    document.getElementById("greeting").textContent = `Welcome, ${name}`;
    document.getElementById("emailDisplay").textContent = email;
    document.getElementById("balanceDisplay").textContent = `$${balance}`;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>

  <script>
    // Photo cropper: drag to move, slider to zoom
    let crop = null;
    let drag = null;
    const FRAME_BG = "#f2f5f7";

    function loadImage(input) {
      const file = input.files[0];
      const box = document.getElementById("cropper");
      if (crop && crop.url) URL.revokeObjectURL(crop.url);
      crop = null;
      box.hidden = true;
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = document.getElementById("cropImg");
      img.onload = () => {
        box.hidden = false;
        const frame = document.getElementById("cropFrame");
        const fw = frame.clientWidth, fh = frame.clientHeight;
        const natW = img.naturalWidth, natH = img.naturalHeight;
        const cover = Math.max(fw / natW, fh / natH);
        const contain = Math.min(fw / natW, fh / natH);
        crop = {
          img, url, natW, natH,
          min: contain, max: cover * 3, scale: cover,
          x: (fw - natW * cover) / 2, y: (fh - natH * cover) / 2
        };
        document.getElementById("cropZoom").value = ((cover - contain) / (cover * 3 - contain)) * 100;
        applyCrop();
      };
      img.onerror = () => {
        alert("That file could not be used as an image. Try a JPG or PNG.");
        input.value = "";
      };
      img.src = url;
    }

    function applyCrop() {
      const frame = document.getElementById("cropFrame");
      const fw = frame.clientWidth, fh = frame.clientHeight;
      const w = crop.natW * crop.scale, h = crop.natH * crop.scale;
      // Keep the photo from being dragged out of the frame
      crop.x = w >= fw ? Math.min(0, Math.max(fw - w, crop.x)) : Math.min(fw - w, Math.max(0, crop.x));
      crop.y = h >= fh ? Math.min(0, Math.max(fh - h, crop.y)) : Math.min(fh - h, Math.max(0, crop.y));
      Object.assign(crop.img.style, { width: w + "px", height: h + "px", left: crop.x + "px", top: crop.y + "px" });
    }

    function onCropZoom(value) {
      if (!crop) return;
      const frame = document.getElementById("cropFrame");
      const cx = frame.clientWidth / 2, cy = frame.clientHeight / 2;
      const px = (cx - crop.x) / crop.scale, py = (cy - crop.y) / crop.scale;
      crop.scale = crop.min + (crop.max - crop.min) * (value / 100);
      crop.x = cx - px * crop.scale;
      crop.y = cy - py * crop.scale;
      applyCrop();
    }

    function cropDown(e) {
      if (!crop) return;
      drag = { px: e.clientX, py: e.clientY, x: crop.x, y: crop.y };
      e.currentTarget.setPointerCapture(e.pointerId);
      e.currentTarget.classList.add("dragging");
    }
    function cropMove(e) {
      if (!drag) return;
      crop.x = drag.x + e.clientX - drag.px;
      crop.y = drag.y + e.clientY - drag.py;
      applyCrop();
    }
    function cropUp(e) {
      drag = null;
      e.currentTarget.classList.remove("dragging");
    }
    function cropWheel(e) {
      if (!crop) return;
      e.preventDefault();
      const zoom = document.getElementById("cropZoom");
      zoom.value = Math.min(100, Math.max(0, +zoom.value - e.deltaY / 10));
      onCropZoom(zoom.value);
    }

    // Draw exactly what the frame shows into a 4:3 image
    function getCroppedImage() {
      if (!crop) return "";
      const fw = document.getElementById("cropFrame").clientWidth;
      const outW = 900, outH = 675, r = outW / fw;
      const canvas = document.createElement("canvas");
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = FRAME_BG;
      ctx.fillRect(0, 0, outW, outH);
      ctx.drawImage(crop.img, crop.x * r, crop.y * r, crop.natW * crop.scale * r, crop.natH * crop.scale * r);
      return canvas.toDataURL("image/jpeg", 0.82);
    }

    function openListingForm() {
      crop = null;
      document.getElementById("listingFormContainer").innerHTML = `
        <div class="form-card">
          <div class="field"><label for="listingTitle">Title</label><input id="listingTitle" type="text" /></div>
          <div class="field">
            <label for="listingImage">Photo</label>
            <input id="listingImage" type="file" accept="image/*" onchange="loadImage(this)" />
            <div id="cropper" class="cropper" hidden>
              <div class="crop-frame" id="cropFrame" onpointerdown="cropDown(event)" onpointermove="cropMove(event)" onpointerup="cropUp(event)" onpointercancel="cropUp(event)" onwheel="cropWheel(event)">
                <img id="cropImg" alt="" draggable="false" />
              </div>
              <div class="crop-zoom"><label for="cropZoom">Zoom</label><input id="cropZoom" type="range" min="0" max="100" value="0" oninput="onCropZoom(this.value)" /></div>
              <p class="muted crop-hint">Drag the photo to move it. This frame matches how it shows on the site.</p>
            </div>
          </div>
          <div class="field"><label for="listingDescription">Description</label><textarea id="listingDescription"></textarea></div>
          <div class="field"><label for="listingRate">Rate per day ($)</label><input id="listingRate" type="number" min="1" /></div>
          <div class="row">
            <button onclick="saveListing()" class="btn btn-primary">Save listing</button>
            <button onclick="document.getElementById('listingFormContainer').innerHTML = ''" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      `;
    }

    function saveListing() {
      const title = document.getElementById("listingTitle").value;
      const image = getCroppedImage();
      const description = document.getElementById("listingDescription").value;
      const rate = parseFloat(document.getElementById("listingRate").value);

      if (!title || !image || !description || isNaN(rate) || rate <= 0) {
        alert("Please fill out all fields and choose a photo.");
        return;
      }

      const listings = JSON.parse(localStorage.getItem("userListings") || "[]");

      const newListing = {
        id: Date.now(),
        title,
        image,
        description,
        rate,
        hiddenInProfile: false
      };

      listings.push(newListing);
      try {
        localStorage.setItem("userListings", JSON.stringify(listings));
      } catch (err) {
        alert("Not enough storage left in this browser. Delete an old listing or choose a smaller photo.");
        return;
      }

      alert("Listing created!");
      window.location.reload();
    }

    function deleteListing(id) {
      if (!confirm("Delete this listing?")) return;
      const listings = JSON.parse(localStorage.getItem("userListings") || "[]");
      const updated = listings.filter(l => l.id !== id);
      localStorage.setItem("userListings", JSON.stringify(updated));
      window.location.reload();
    }

    const rentings = JSON.parse(localStorage.getItem("userRentings") || "[]");
    const rentingsContainer = document.getElementById("rentingsContainer");

    if (rentings.length > 0 && rentingsContainer) {
      rentingsContainer.innerHTML = "";
      rentings.forEach(rental => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${esc(rental.image)}" alt="" />
          <div class="card-body">
            <h3>${esc(rental.title)}</h3>
            <p class="card-desc">${esc(rental.description)}</p>
            <p class="muted" style="font-size:0.9rem">${esc(rental.start)} to ${esc(rental.end)}</p>
            <p class="price"><strong>$${esc(rental.cost)}</strong> total</p>
          </div>
        `;
        rentingsContainer.appendChild(card);
      });
    }

    function resetUserData() {
      if (!confirm("Delete your account? This removes your details, balance and rentals.")) return;
      localStorage.removeItem("userName");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("userBalance");
      localStorage.removeItem("rentings");
      localStorage.removeItem("userRentings");

      const listings = JSON.parse(localStorage.getItem("userListings") || "[]");
      const updated = listings.map(l => ({ ...l, hiddenInProfile: true }));
      localStorage.setItem("userListings", JSON.stringify(updated));

      alert("Your account has been deleted");
      window.location.href = "index.html";
    }

    function logoutUser() {
      if (!confirm("Reset all data on this device? This cannot be undone.")) return;
      localStorage.clear();
      window.location.href = "index.html";
    }

    const listings = JSON.parse(localStorage.getItem("userListings") || "[]");
    const container = document.getElementById("listingsContainer");
    const visible = listings.filter(l => !l.hiddenInProfile);

    if (visible.length > 0 && container) {
      container.innerHTML = "";
      visible.forEach(listing => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${esc(listing.image)}" alt="" />
          <div class="card-body">
            <h3>${esc(listing.title)}</h3>
            <p class="card-desc">${esc(listing.description)}</p>
            <p class="price"><strong>$${esc(listing.rate)}</strong> per day</p>
            <div class="card-actions">
              <a class="btn btn-secondary" href="listing.html?id=${listing.id}">View listing</a>
              <button onclick="deleteListing(${listing.id})" class="btn btn-danger">Delete</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
  <script src="register-sw.js"></script>
</body>
</html>
