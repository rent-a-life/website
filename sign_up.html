<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | Rentables</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rentables.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="index.html"><img src="icon-192-v2.png" alt="" /><span>Rentables</span></a></header>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Start renting or listing items in a minute.</p>
      <form onsubmit="return handleSignup()">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
        <div class="message" id="signupMessage" role="status"></div>
      </form>
      <p class="auth-foot">Already have an account? <a href="sign_in2.html">Log in</a></p>
    </section>
  </main>

  <script>
    function handleSignup() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("signupMessage");

      if (name && email && password) {
        localStorage.setItem("userName", name);
        localStorage.setItem("userEmail", email);
        localStorage.setItem("userPassword", password);
        message.textContent = "Account created. Taking you to the marketplace.";
        localStorage.setItem("userBalance", "50");
        setTimeout(() => {
          window.location.href = "front2.html";
        }, 1000);
        return false;
      }
      return false;
    }
  </script>
</body>
</html>
