<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in | Rentables</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rentables.css" />
</head>
<body>
  <header class="nav"><a class="brand" href="index.html"><img src="icon-192-v2.png" alt="" /><span>Rentables</span></a></header>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Log in</h1>
      <p class="sub">Enter your details to access your account.</p>
      <form onsubmit="return validateLogin()">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
        <div id="error" class="error" role="alert"></div>
      </form>
      <p class="auth-foot">New to Rentables? <a href="sign_up.html">Create an account</a></p>
    </section>
  </main>

  <script>
    function validateLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error");

      const correctPassword = localStorage.getItem("userPassword");
      const correctEmail = localStorage.getItem("userEmail");
      const correct2Email = "maangarg@gmail.com";
      const correct2Password = "44445678";

      if (email === correctEmail && password === correctPassword) {
        errorDiv.textContent = "";
        window.location.href = 'front2.html';
        return false;
      } else if (email === correct2Email && password === correct2Password) {
        errorDiv.textContent = "";
        window.location.href = 'front.html';
        return false;
      } else {
        errorDiv.textContent = "Email or password is incorrect. Check your details and try again.";
        return false;
      }
    }
  </script>
</body>
</html>
