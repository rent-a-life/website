<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rentables</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rentables.css" />
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .hero { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #2b7a9b; }
    /* Blurred copy fills any space the full image does not cover */
    .hero::before, .hero::after {
      content: ""; position: absolute; inset: 0;
      background: url('background.png') center / cover no-repeat;
    }
    .hero::before { filter: blur(24px); transform: scale(1.1); }
    /* Full image, never cropped */
    .hero::after { background-size: contain; }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html"><img src="icon-192-v2.png" alt="" /><span>Rentables</span></a>
    <span class="nav-spacer"></span>
    <a class="btn btn-ghost" href="sign_in2.html">Log in</a>
    <a class="btn btn-primary" href="sign_up.html">Create account</a>
  </header>
  <main class="hero" role="img" aria-label="Rent anything from anyone. Access thousands of items, safely and for sustainable living."></main>
</body>
</html>
