<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rent Listing</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192-v2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rentables.css" />
</head>
<body>
    <header class="nav">
    <button onclick="window.location.href='front2.html'" class="btn btn-ghost">Back to marketplace</button>
    <span class="nav-spacer"></span>
    <div id="userBalanceBox" class="balance">Balance <span id="userBalance"></span></div>
  </header>
  

  <main class="container detail">
    <div class="detail-media"><img id="listingImage" src="" alt="" /></div>
    <div class="detail-panel">
      <h1 id="listingTitle">Loading</h1>
      <p class="price" id="rateDisplay"></p>
      <p class="detail-desc" id="listingDescription"></p>
      <label for="datepicker">Rental dates</label>
      <input type="text" id="datepicker" placeholder="Choose start and end date" readonly />
      <div class="output" id="summary">Select dates to calculate cost</div>
      <button onclick="submitRental()" class="btn btn-primary btn-block">Rent now</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/litepicker/dist/bundle.js"></script>
  <script>
    function goBack() {
      window.history.back();
    }

    const balance = localStorage.getItem("userBalance");
    if (balance) {
      document.getElementById("userBalance").textContent = `$${balance}`;
    } else {
      document.getElementById("userBalanceBox").style.display = "none";
    }

    function spendFromBalance(amount) {
      let currentBalance = parseFloat(localStorage.getItem("userBalance")) || 0;
      if (amount > currentBalance) {
        alert("Insufficient balance!");
        return false;
      }
      const newBalance = currentBalance - amount;
      localStorage.setItem("userBalance", newBalance.toFixed(2));
      const balanceDisplay = document.getElementById("userBalance");
      if (balanceDisplay) {
        balanceDisplay.textContent = `$${newBalance.toFixed(2)}`;
      }
      return true;
    }

    const params = new URLSearchParams(window.location.search);
    const listingId = params.get("id");
    const listings = JSON.parse(localStorage.getItem("userListings") || "[]");
    const listing = listings.find(l => l.id == listingId);

    let ratePerDay = 15;

    if (listing) {
      document.getElementById("listingImage").src = listing.image;
      document.getElementById("listingImage").alt = listing.title;
      document.getElementById("listingTitle").textContent = listing.title;
      document.getElementById("listingDescription").textContent = listing.description;
      document.title = `Rent ${listing.title}`;
      ratePerDay = listing.rate || 15;
      document.getElementById("rateDisplay").innerHTML = `<strong>$${ratePerDay}</strong> per day`;
    } else {
      document.querySelector(".detail").innerHTML = '<div><h1>Listing not found</h1><p class="muted" style="margin:8px 0 20px">It may have been deleted by its owner.</p><a class="btn btn-secondary" href="front2.html">Back to marketplace</a></div>';
    }

    const summary = document.getElementById('summary');

    const today = new Date();
    const currentMonth = today.getMonth() + 1;
    const currentYear = today.getFullYear();

    const picker = new Litepicker({
      element: document.getElementById('datepicker'),
      singleMode: false,
      numberOfMonths: 1,
      numberOfColumns: 1,
      autoApply: true,
      minDate: today,
      startMonth: currentMonth,
      startYear: currentYear,
      setup: (picker) => {
        picker.on('selected', (startDate, endDate) => {
          const days = endDate.diff(startDate, 'days') + 1;
          summary.textContent = `${days} day${days > 1 ? 's' : ''} selected • Total: $${days * ratePerDay}`;
        });
      }
    });

    function logRental(listing, startDate, endDate, totalCost) {
      const rentings = JSON.parse(localStorage.getItem("userRentings") || "[]");
      const newRental = {
        id: Date.now(),
        title: listing.title,
        image: listing.image,
        description: listing.description,
        start: startDate.format('DD/MM/YYYY'),
        end: endDate.format('DD/MM/YYYY'),
        cost: totalCost
      };
      rentings.push(newRental);
      localStorage.setItem("userRentings", JSON.stringify(rentings));
    }

    function submitRental() {
      const start = picker.getStartDate();
      const end = picker.getEndDate();
      if (!start || !end) {
        alert('Please select rental dates first!');
      } else {
        const days = end.diff(start, 'days') + 1;
        const totalCost = days * ratePerDay;
        const success = spendFromBalance(totalCost);
        if (success) {
          logRental(listing, start, end, totalCost);
          alert(`Rental submitted from ${start.format('DD/MM/YYYY')} to ${end.format('DD/MM/YYYY')} for ${days} days!`);
        }
      }
    }

  </script>
</body>
</html>
